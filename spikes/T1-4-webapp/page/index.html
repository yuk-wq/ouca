<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=500" />
    <meta name="t14-build" content="__OUCA_T14_BUILD__" />
    <title>T1-4 調べる画面</title>
  </head>
  <body>
    <div id="app" data-build="__OUCA_T14_BUILD__"></div>
    <!-- 埋め込みの JSON。doGet が目印を置き換える -->
    <script type="application/json" id="embedded">
      __OUCA_T14_EMBED__
    </script>
    <!-- module でない小さな script。module の script が動かなくても、こちらは動くかを確かめる -->
    <script>
      try {
        // ビルドの印は、メニューの JSON とは別の meta（なければ body の data-build）から読む
        var build = '';
        try {
          build = document.querySelector('meta[name="t14-build"]').getAttribute('content') || '';
        } catch (e) {
          build = '';
        }
        // meta が取り除かれていたら、body の data-build から読む
        if (!build) {
          try {
            build = document.querySelector('[data-build]').getAttribute('data-build') || '';
          } catch (e) {
            build = '';
          }
        }
        google.script.run.recordFact('W2', '', 'classic', '動いた', '{}', build);
      } catch (e) {
        // 送れなければ、行が来ない
      }
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
